name: deploy

# Run by hand from the Actions tab: Actions > deploy > Run workflow. Three steps, in order:
#   1. Deploy on PulseChain                -> gives PULSECHAIN_MIRROR_SYNC and PULSECHAIN_ORDER_FILLER
#   2. Deploy on Ethereum and link it      -> needs those two; gives ETHEREUM_MIRROR_REGISTRAR and ETHEREUM_ORDER_BOOK
#   3. Link PulseChain                     -> needs all four
# Pick the network: the testnets (PulseChain Testnet v4 + Sepolia) to rehearse, then mainnet.
# Leave "broadcast" unticked for a dry run, which simulates the step and sends nothing.
# Use the same deployer key for all three steps of a network: only it can link the chains, once.
# Each network has its own deployer key, in a repository secret (Settings > Secrets and variables >
# Actions): DEPLOYER_PRIVATE_KEY_TESTNET and DEPLOYER_PRIVATE_KEY_MAINNET. Repository secrets work on
# every GitHub plan; environment secrets don't, in a private repository on GitHub Free.
# A real mainnet run also needs "mainnet" typed into the confirm box.
# The full guide: deploy/README.md.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network"
        required: true
        type: choice
        options:
          - "Testnet: PulseChain Testnet v4 + Sepolia"
          - "Mainnet: PulseChain + Ethereum"
      step:
        description: "Step"
        required: true
        type: choice
        options:
          - "1. Deploy on PulseChain"
          - "2. Deploy on Ethereum and link it"
          - "3. Link PulseChain"
      broadcast:
        description: "Send it for real (leave unticked for a dry run)"
        required: true
        type: boolean
        default: false
      confirm:
        description: "Mainnet only, when sending for real: type mainnet"
        required: false
        type: string
      admin:
        description: "Admin wallet (steps 1 and 2): a plain wallet or a Safe"
        required: false
        type: string
      beneficiary:
        description: "Who receives every payment for names (step 1). Fixed for good once deployed"
        required: false
        type: string
        default: "0x102785E63DCD7C2ba1146E96da7fE429155602C6"
      pulsechain_mirror_sync:
        description: "PULSECHAIN_MIRROR_SYNC from step 1 (steps 2 and 3)"
        required: false
        type: string
      pulsechain_order_filler:
        description: "PULSECHAIN_ORDER_FILLER from step 1 (steps 2 and 3)"
        required: false
        type: string
      ethereum_mirror_registrar:
        description: "ETHEREUM_MIRROR_REGISTRAR from step 2 (step 3)"
        required: false
        type: string
      ethereum_order_book:
        description: "ETHEREUM_ORDER_BOOK from step 2 (step 3)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.step }} (${{ startsWith(inputs.network, 'Testnet') && 'testnet' || 'mainnet' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Foundry
        # Foundry 1.9.0, which knows Sepolia's new gas costs: creating a contract there costs about 7
        # times what it does on Ethereum, and older versions give step 2 too little gas on Sepolia.
        # Straight from its release and checked against its SHA-256, rather than through the
        # foundryup installer, whose 2.0.0 release couldn't be downloaded on 8 November 2026. To
        # move to a newer Foundry, change FOUNDRY_VERSION and FOUNDRY_SHA256 together.
        env:
          FOUNDRY_VERSION: v1.9.0
          FOUNDRY_SHA256: 8d17599b42e3139f1a9c171be3798c4ed8e743ae17b84cc3435e57bf2a51ae99
        run: |
          curl -sSfL --retry 20 --retry-delay 15 --retry-max-time 600 --retry-all-errors -o foundry.tar.gz \
            "https://github.com/foundry-rs/foundry/releases/download/$FOUNDRY_VERSION/foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          echo "$FOUNDRY_SHA256  foundry.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.foundry/bin"
          tar -xzf foundry.tar.gz -C "$HOME/.foundry/bin"
          rm foundry.tar.gz
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          "$HOME/.foundry/bin/forge" --version

      - name: Cache ENSv2 and its libraries
        uses: actions/cache@v4
        with:
          path: lib
          key: deps-${{ hashFiles('install-deps.sh', 'patches/**') }}

      - name: Install dependencies
        run: bash install-deps.sh

      - name: Run the unit tests first
        run: forge test --no-match-path "test/fork/*"

      - name: Run the step
        env:
          STEP: ${{ inputs.step }}
          NETWORK: ${{ inputs.network }}
          BROADCAST: ${{ inputs.broadcast }}
          CONFIRM: ${{ inputs.confirm }}
          # Repository secrets, one deployer key per network. Picked below, never one for the other.
          DEPLOYER_PRIVATE_KEY_TESTNET: ${{ secrets.DEPLOYER_PRIVATE_KEY_TESTNET }}
          DEPLOYER_PRIVATE_KEY_MAINNET: ${{ secrets.DEPLOYER_PRIVATE_KEY_MAINNET }}
          # Optional repository variables (Settings > Secrets and variables > Actions > Variables)
          # point a network at your own RPC providers.
          PULSECHAIN_RPC_URL: >-
            ${{ startsWith(inputs.network, 'Testnet')
              && (vars.PULSECHAIN_TESTNET_RPC_URL || 'https://rpc.v4.testnet.pulsechain.com')
              || (vars.PULSECHAIN_RPC_URL || 'https://rpc.pulsechain.com') }}
          ETHEREUM_RPC_URL: >-
            ${{ startsWith(inputs.network, 'Testnet')
              && (vars.SEPOLIA_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com')
              || (vars.ETHEREUM_RPC_URL || 'https://ethereum-rpc.publicnode.com') }}
          ADMIN: ${{ inputs.admin }}
          BENEFICIARY: ${{ inputs.beneficiary }}
          PULSECHAIN_MIRROR_SYNC: ${{ inputs.pulsechain_mirror_sync }}
          PULSECHAIN_ORDER_FILLER: ${{ inputs.pulsechain_order_filler }}
          ETHEREUM_MIRROR_REGISTRAR: ${{ inputs.ethereum_mirror_registrar }}
          ETHEREUM_ORDER_BOOK: ${{ inputs.ethereum_order_book }}
        run: |
          # Leave out inputs that were left empty, so the scripts use their defaults or say what is missing.
          for v in ADMIN BENEFICIARY PULSECHAIN_MIRROR_SYNC PULSECHAIN_ORDER_FILLER ETHEREUM_MIRROR_REGISTRAR ETHEREUM_ORDER_BOOK; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # This network's deployer key, and only this network's.
          if [[ "$NETWORK" == Testnet* ]]; then key_name=DEPLOYER_PRIVATE_KEY_TESTNET; else key_name=DEPLOYER_PRIVATE_KEY_MAINNET; fi
          DEPLOYER_PRIVATE_KEY="${!key_name}"
          unset DEPLOYER_PRIVATE_KEY_TESTNET DEPLOYER_PRIVATE_KEY_MAINNET
          if [ -n "$DEPLOYER_PRIVATE_KEY" ]; then export DEPLOYER_PRIVATE_KEY; else unset DEPLOYER_PRIVATE_KEY; fi
          case "$STEP" in
            1.*) target="script/pulsechain/DeployPulseChain.s.sol:DeployPulseChain"; rpc="$PULSECHAIN_RPC_URL" ;;
            2.*) target="script/ethereum/DeployEthereum.s.sol:DeployEthereum"; rpc="$ETHEREUM_RPC_URL" ;;
            3.*) target="script/pulsechain/LinkPulseChain.s.sol:LinkPulseChain"; rpc="$PULSECHAIN_RPC_URL" ;;
            *) echo "::error::Unknown step: $STEP"; exit 1 ;;
          esac
          args=(script "$target" --rpc-url "$rpc" --slow)
          # On the testnets, set the fees. PulseChain Testnet v4's validators skip tips below
          # 0.001 gwei, and Foundry would offer 1 wei there. Sepolia includes tiny tips, and Foundry
          # would offer about 1 gwei, so step 2 would cost about 0.15 Sepolia ETH instead of 0.002.
          if [[ "$NETWORK" == Testnet* ]]; then
            case "$STEP" in
              2.*) args+=(--with-gas-price 0.05gwei --priority-gas-price 0.01gwei) ;;
              *) args+=(--with-gas-price 2gwei --priority-gas-price 1gwei) ;;
            esac
          fi
          if [ "$BROADCAST" = "true" ]; then
            if [ -z "${DEPLOYER_PRIVATE_KEY:-}" ]; then
              echo "::error::Add the $key_name repository secret (Settings > Secrets and variables > Actions) before sending for real."
              exit 1
            fi
            if [[ "$NETWORK" == Mainnet* ]] && [ "$(echo "$CONFIRM" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')" != "mainnet" ]; then
              echo "::error::This sends real transactions on mainnet. To go ahead, type mainnet in the confirm box."
              exit 1
            fi
            args+=(--broadcast)
          else
            echo "Dry run: simulating only, nothing will be sent."
          fi
          forge "${args[@]}" 2>&1 | tee output.txt
          status=${PIPESTATUS[0]}
          {
            echo "## $STEP"
            echo "$NETWORK"
            if [ "$BROADCAST" = "true" ]; then echo "Sent for real."; else echo "Dry run: nothing was sent."; fi
            echo '```'
            grep -E "^\s+(Network|PULSECHAIN_|ETHEREUM_|START_BLOCK_|Payments go to|UniversalResolver|\.hex|Root|Default|Price|Name rules|Resolver|Label|Reserved|Deployer|Linked)" output.txt || true
            # What it costs, and whether every transaction went through.
            grep -E "^(Estimated (total gas used|amount required)|ONCHAIN EXECUTION)" output.txt || true
            echo '```'
            # After a real run, the bot's settings from this step, ready to paste into Railway.
            bot=$(grep -E "^\s+(PULSECHAIN_(MIRROR_SYNC|ORDER_FILLER|REGISTRAR|HEX_REGISTRY|USDC|CHECKOUT)|ETHEREUM_(MIRROR_REGISTRAR|ORDER_BOOK)|START_BLOCK_(PULSECHAIN|ETHEREUM))\s" output.txt | awk '{print $1 "=" $2}' || true)
            if [ "$BROADCAST" = "true" ] && [ "$status" = "0" ] && [ -n "$bot" ]; then
              net=$([[ "$NETWORK" == Testnet* ]] && echo testnet || echo mainnet)
              echo "### For the bot"
              echo "On Railway, in the bot's ${net/mainnet/production} environment: Variables, RAW Editor. Add these lines, then deploy the change."
              echo '```'
              echo "$bot"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Save the deployment record
        if: ${{ inputs.broadcast }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ startsWith(inputs.network, 'Testnet') && 'testnet' || 'mainnet' }}-${{ github.run_number }}
          path: |
            broadcast/
            output.txt
