name: deploy

# Run by hand from the Actions tab: Actions > deploy > Run workflow. One step deploys everything.
# Pick the network: the testnet (PulseChain Testnet v4) to rehearse, then mainnet (PulseChain).
# Leave "broadcast" unticked for a dry run, which simulates the deployment and sends nothing.
# Each network has its own deployer key, in a repository secret (Settings > Secrets and variables >
# Actions): DEPLOYER_PRIVATE_KEY_TESTNET and DEPLOYER_PRIVATE_KEY_MAINNET. Repository secrets work on
# every GitHub plan; environment secrets don't, in a private repository on GitHub Free.
# A real mainnet run also needs "mainnet" typed into the confirm box.
# The full guide: deploy/README.md.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network"
        required: true
        type: choice
        options:
          - "Testnet: PulseChain Testnet v4"
          - "Mainnet: PulseChain"
      broadcast:
        description: "Send it for real (leave unticked for a dry run)"
        required: true
        type: boolean
        default: false
      confirm:
        description: "Mainnet only, when sending for real: type mainnet"
        required: false
        type: string
      admin:
        description: "Admin wallet: a plain wallet or a Safe"
        required: true
        type: string
      beneficiary:
        description: "Who receives every payment for names. Fixed for good once deployed"
        required: false
        type: string
        default: "0x102785E63DCD7C2ba1146E96da7fE429155602C6"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy on PulseChain (${{ startsWith(inputs.network, 'Testnet') && 'testnet' || 'mainnet' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Foundry
        # Foundry 1.9.0, the same as the test workflow, straight from its release and checked
        # against its SHA-256, rather than through the foundryup installer, whose 2.0.0 release
        # couldn't be downloaded on 8 November 2026. To move to a newer Foundry, change
        # FOUNDRY_VERSION and FOUNDRY_SHA256 together.
        env:
          FOUNDRY_VERSION: v1.9.0
          FOUNDRY_SHA256: 8d17599b42e3139f1a9c171be3798c4ed8e743ae17b84cc3435e57bf2a51ae99
        run: |
          curl -sSfL --retry 20 --retry-delay 15 --retry-max-time 600 --retry-all-errors -o foundry.tar.gz \
            "https://github.com/foundry-rs/foundry/releases/download/$FOUNDRY_VERSION/foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          echo "$FOUNDRY_SHA256  foundry.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.foundry/bin"
          tar -xzf foundry.tar.gz -C "$HOME/.foundry/bin"
          rm foundry.tar.gz
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          "$HOME/.foundry/bin/forge" --version

      - name: Cache ENSv2 and its libraries
        uses: actions/cache@v4
        with:
          path: lib
          key: deps-${{ hashFiles('install-deps.sh', 'patches/**') }}

      - name: Install dependencies
        run: bash install-deps.sh

      - name: Run the unit tests first
        run: forge test --no-match-path "test/fork/*"

      - name: Deploy
        env:
          NETWORK: ${{ inputs.network }}
          BROADCAST: ${{ inputs.broadcast }}
          CONFIRM: ${{ inputs.confirm }}
          # Repository secrets, one deployer key per network. Picked below, never one for the other.
          DEPLOYER_PRIVATE_KEY_TESTNET: ${{ secrets.DEPLOYER_PRIVATE_KEY_TESTNET }}
          DEPLOYER_PRIVATE_KEY_MAINNET: ${{ secrets.DEPLOYER_PRIVATE_KEY_MAINNET }}
          # Optional repository variables (Settings > Secrets and variables > Actions > Variables)
          # point a network at your own RPC provider.
          PULSECHAIN_RPC_URL: >-
            ${{ startsWith(inputs.network, 'Testnet')
              && (vars.PULSECHAIN_TESTNET_RPC_URL || 'https://rpc.v4.testnet.pulsechain.com')
              || (vars.PULSECHAIN_RPC_URL || 'https://rpc.pulsechain.com') }}
          ADMIN: ${{ inputs.admin }}
          BENEFICIARY: ${{ inputs.beneficiary }}
        run: |
          # Leave out inputs that were left empty, so the script uses its defaults or says what is missing.
          for v in ADMIN BENEFICIARY; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # This network's deployer key, and only this network's.
          if [[ "$NETWORK" == Testnet* ]]; then key_name=DEPLOYER_PRIVATE_KEY_TESTNET; else key_name=DEPLOYER_PRIVATE_KEY_MAINNET; fi
          DEPLOYER_PRIVATE_KEY="${!key_name}"
          unset DEPLOYER_PRIVATE_KEY_TESTNET DEPLOYER_PRIVATE_KEY_MAINNET
          if [ -n "$DEPLOYER_PRIVATE_KEY" ]; then export DEPLOYER_PRIVATE_KEY; else unset DEPLOYER_PRIVATE_KEY; fi
          args=(script script/DeployPulseChain.s.sol:DeployPulseChain --rpc-url "$PULSECHAIN_RPC_URL" --slow)
          # On the testnet, set the fees: PulseChain Testnet v4's validators skip tips below
          # 0.001 gwei, and Foundry would offer 1 wei there.
          if [[ "$NETWORK" == Testnet* ]]; then
            args+=(--with-gas-price 2gwei --priority-gas-price 1gwei)
          fi
          if [ "$BROADCAST" = "true" ]; then
            if [ -z "${DEPLOYER_PRIVATE_KEY:-}" ]; then
              echo "::error::Add the $key_name repository secret (Settings > Secrets and variables > Actions) before sending for real."
              exit 1
            fi
            if [[ "$NETWORK" == Mainnet* ]] && [ "$(echo "$CONFIRM" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')" != "mainnet" ]; then
              echo "::error::This sends real transactions on mainnet. To go ahead, type mainnet in the confirm box."
              exit 1
            fi
            args+=(--broadcast)
          else
            echo "Dry run: simulating only, nothing will be sent."
          fi
          forge "${args[@]}" 2>&1 | tee output.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Deploy on PulseChain"
            echo "$NETWORK"
            if [ "$BROADCAST" = "true" ]; then echo "Sent for real."; else echo "Dry run: nothing was sent."; fi
            echo '```'
            grep -E "^\s+(Network|Deployer|=== |PDAI_REGISTRY|REGISTRAR|CHECKOUT|USDC|START_BLOCK|Payments go to|UniversalResolver|Root|Default|Price|Name rules|Resolver|Label|Name cards|Reserved)" output.txt || true
            # What it costs, and whether every transaction went through.
            grep -E "^(Estimated (total gas used|amount required)|ONCHAIN EXECUTION)" output.txt || true
            echo '```'
            # After a real run, the addresses the website needs, ready to paste.
            site=$(grep -E "^\s+(PDAI_REGISTRY|REGISTRAR|CHECKOUT|USDC|START_BLOCK)\s" output.txt | awk '{print $1 "=" $2}' || true)
            if [ "$BROADCAST" = "true" ] && [ "$status" = "0" ] && [ -n "$site" ]; then
              net=$([[ "$NETWORK" == Testnet* ]] && echo testnet || echo mainnet)
              echo "### For the website"
              echo "Fill these in to the $net entry of web/src/deployment.ts, as deploy/website/README.md shows."
              echo '```'
              echo "$site"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Save the deployment record
        if: ${{ inputs.broadcast }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ startsWith(inputs.network, 'Testnet') && 'testnet' || 'mainnet' }}-${{ github.run_number }}
          path: |
            broadcast/
            output.txt
