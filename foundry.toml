[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# PulseChain does not support the opcodes from Ethereum's March 2024 upgrade (TSTORE, MCOPY).
# Checked against the live chain on 2026-11-05, so compile for the previous target.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512

[fmt]
line_length = 120
